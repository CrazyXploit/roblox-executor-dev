name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Clone Luau
        run: git clone --depth 1 https://github.com/luau-lang/luau.git

      - name: Build Luau for arm64
        run: |
          cd luau
          mkdir build-android && cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUAU_BUILD_CLI=OFF -DLUAU_BUILD_TESTS=OFF
          make -j$(nproc)

      - name: Build executor .so
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
            -shared -fPIC -O2 host.c \
            -Iluau/VM/include -Iluau/Compiler/include \
            -Lluau/build-android -lLuau.VM -lLuau.Compiler \
            -o libexecutor.so \
            -Wl,-soname,libexecutor.so

      - name: Build injector
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
            -O2 inject.c -o injector -static

      - name: Pack module
        run: |
          mkdir -p module
          cp module.prop module/
          mkdir -p module/bin
          cp libexecutor.so injector module/bin/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executor-module
          path: module/